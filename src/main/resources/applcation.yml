spring:
  ai:
    openai:
      # Chat model
      api-key: ${OPENAI_API_KEY:local}
      base-url: ${CHAT_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${CHAT_MODEL:gpt-4o-mini}
      
      # Embedding model (OpenAI-compatible)
      embedding:
        api-key: ${EMBEDDING_API_KEY:local}
        base-url: ${EMBEDDING_BASE_URL:http://localhost:8080}
        options:
          model: ${EMBEDDING_MODEL:your-model-name}

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: ${QDRANT_COLLECTION:documents}
        use-tls: ${QDRANT_TLS:false}
        # api-key: ${QDRANT_API_KEY} 
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# WÅasne wÅaÅciwoÅci dla RAG (dostÄpne przez @ConfigurationProperties)
rag:
  chunking:
    chunk-size: ${CHUNK_SIZE:512}
    min-chunk-size: ${MIN_CHUNK_SIZE:128}
    chunk-overlap: ${CHUNK_OVERLAP:50}
  search:
    top-k: ${TOP_K:5}
    similarity-threshold: ${SIMILARITY_THRESHOLD:0.7}