spring:
  main:
    allow-bean-definition-overriding: true
  # Oba auto-configure wykluczone globalnie — beany konfigurujemy ręcznie w AppConfig
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local}
      base-url: ${CHAT_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${CHAT_MODEL:gpt-4o-mini}
      embedding:
        api-key: ${EMBEDDING_API_KEY:local}
        base-url: ${EMBEDDING_BASE_URL:http://localhost:8080}
        options:
          model: ${EMBEDDING_MODEL:your-model-name}
          encoding-format: float
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

rag:
  chunking:
    chunk-size: ${CHUNK_SIZE:512}
    min-chunk-size: ${MIN_CHUNK_SIZE:128}
    chunk-overlap: ${CHUNK_OVERLAP:50}
  search:
    top-k: ${TOP_K:5}
    similarity-threshold: ${SIMILARITY_THRESHOLD:0.7}
